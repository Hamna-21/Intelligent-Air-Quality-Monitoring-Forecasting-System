    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#0ea5e9', // Sky-500
                light: '#e0f2fe',   // Sky-100
                dark: '#0284c7',    // Sky-600
              },
              secondary: {
                DEFAULT: '#6366f1', // Indigo-500
              },
              surface: '#ffffff', 
              background: '#f8fafc', // Slate-50
              text: {
                DEFAULT: '#1e293b', // Slate-800
                muted: '#64748b',   // Slate-500
                light: '#94a3b8'    // Slate-400
              },
              subtle: '#e2e8f0',    // Slate-200 (Borders)
            },
            fontFamily: {
              sans: ['"Inter"', 'system-ui', 'sans-serif'],
              heading: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            boxShadow: {
              'card': '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)',
              'card-hover': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
              'glow': '0 0 20px rgba(14, 165, 233, 0.15)',
            },
            animation: {
              'fade-in': 'fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
  <style>
    /* Global Reset */
    body {
      margin: 0;
      overflow: hidden; 
      background-color: #f8fafc;
      font-family: 'Inter', sans-serif;
      color: #1e293b;
    }

    /* Professional Slim Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Modern Card Styles (SaaS Style) */
    .glass-panel {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
    }
    
    .glass-card {
      background: #ffffff;
      border: 1px solid #f1f5f9;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      border-radius: 1rem;
    }

    .glass-sidebar {
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
    }
    
    .glass-header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid #e2e8f0;
    }

    /* Input Autofill Fix */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    textarea:-webkit-autofill,
    textarea:-webkit-autofill:hover,
    textarea:-webkit-autofill:focus,
    select:-webkit-autofill,
    select:-webkit-autofill:hover,
    select:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0px 1000px #ffffff inset;
      transition: background-color 5000s ease-in-out 0s;
    }
    
    /* Utility */
    .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #e2e8f0;
        border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background-color: transparent;
    }

    /* Cluster Customization */
    .marker-cluster-small {
        background-color: rgba(181, 226, 140, 0.6);
    }
    .marker-cluster-small div {
        background-color: rgba(110, 204, 57, 0.6);
    }
    .marker-cluster-medium {
        background-color: rgba(241, 211, 87, 0.6);
    }
    .marker-cluster-medium div {
        background-color: rgba(240, 194, 12, 0.6);
    }
    .marker-cluster-large {
        background-color: rgba(253, 156, 115, 0.6);
    }
    .marker-cluster-large div {
        background-color: rgba(241, 128, 23, 0.6);
    }
    /* Custom colored clusters for AQI */
    .marker-cluster-aqi-good { background-color: rgba(34, 197, 94, 0.2); }
    .marker-cluster-aqi-good div { background-color: rgba(34, 197, 94, 0.7); color: white; }
    
    .marker-cluster-aqi-moderate { background-color: rgba(234, 179, 8, 0.2); }
    .marker-cluster-aqi-moderate div { background-color: rgba(234, 179, 8, 0.7); color: white; }
    
    .marker-cluster-aqi-unhealthy { background-color: rgba(239, 68, 68, 0.2); }
    .marker-cluster-aqi-unhealthy div { background-color: rgba(239, 68, 68, 0.7); color: white; }
    
    .marker-cluster-aqi-hazardous { background-color: rgba(168, 85, 247, 0.2); }
    .marker-cluster-aqi-hazardous div { background-color: rgba(168, 85, 247, 0.7); color: white; }

  </style>
